<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!--
  Muninn interim app icon (vector), drawn from the brand sheet's look: raven in profile, gold ring,
  snow-capped mountains, navy sky. Colours are the brand palette (see DECISIONS.md D043).
  The PNGs in frontend/public/assets/icons/ are exported from these files; see ../ASSET-MANIFEST.md.
  -->

  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#1f3654"/>
      <stop offset="1" stop-color="#0b1a2b"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e9ee"/>
      <stop offset="1" stop-color="#9fb0c6"/>
    </linearGradient>
    <clipPath id="inside-ring"><circle cx="256" cy="246" r="162"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- Mountains and rock, kept inside the ring -->
  <g clip-path="url(#inside-ring)">
    <path d="M196 420 L262 330 L292 360 L340 276 L372 316 L396 290 L460 380 L460 420 Z" fill="#2f4b6e"/>
    <path d="M340 276 L362 304 L350 300 L336 320 L328 298 Z M396 290 L414 314 L402 311 L390 324 Z" fill="url(#snow)"/>
    <path d="M150 410 C190 392 290 390 350 404 L370 430 L130 430 Z" fill="#1f3654"/>
  </g>
  <!-- Gold ring -->
  <circle cx="256" cy="246" r="168" fill="none" stroke="#d4af7c" stroke-width="12"/>
  <!-- Raven body, with a thin slate edge so it separates from the dark sky -->
  <path d="M402 188
           C382 170 352 156 326 148
           C306 126 264 122 242 142
           C222 158 216 184 214 206
           C188 236 158 288 140 336
           L96 424 L134 413 L124 442
           L180 386
           C224 378 274 358 294 312
           C306 284 308 252 302 230
           L310 222 L300 217 L310 207
           C334 198 364 194 402 188 Z"
        fill="#060c14" stroke="#2f4b6e" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wing with feather lines -->
  <path d="M224 212 C194 254 166 306 150 352 L142 398 C194 364 246 324 268 272 C278 246 258 222 224 212 Z"
        fill="#0e1a29" stroke="#2f4b6e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M234 242 C216 278 194 318 174 356 M250 254 C234 290 212 324 190 352" fill="none" stroke="#2f4b6e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Beak line and gold eye -->
  <path d="M402 188 C362 186 330 184 304 180" fill="none" stroke="#2f4b6e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="290" cy="158" r="7" fill="#d4af7c"/>
  <!-- Legs -->
  <path d="M238 368 L234 400 M262 356 L266 398" stroke="#060c14" stroke-width="8" stroke-linecap="round"/>
  <!-- Toes gripping the rock -->
  <path d="M220 402 L248 400 M252 398 L282 398" stroke="#060c14" stroke-width="6" stroke-linecap="round"/>
</svg>
